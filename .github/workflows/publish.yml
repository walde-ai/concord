name: Publish

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Publish note (recorded in the run only)"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish @walde.ai/concord
        run: npm publish --access public
        working-directory: packages/concord
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
